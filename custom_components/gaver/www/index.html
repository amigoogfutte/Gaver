<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gaver">
<meta name="theme-color" content="#A3311F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gaver</title>
<style>
:root{
  --bg:#F6F3F1; --card:#FFFFFF; --ink:#1E1A19; --muted:#615956; --line:#D3CAC6; --soft:#ECE5E2;
  --accent:#A3311F; --accent-soft:#FBE9E6; --green:#1F6F5C; --green-soft:#E3F1EC; --gold:#8A5A00; --gold-soft:#FFF3DA;
  --warn-bg:#FFF3E6; --warn-ink:#6B3A10;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
html,body,button,a,input,select,textarea,summary,label{touch-action:manipulation}
.hidden{display:none!important}
:root{--top:max(env(safe-area-inset-top,0px),env(titlebar-area-height,0px))}
.wrap{max-width:620px;margin:0 auto;padding:calc(10px + var(--top)) 16px calc(100px + env(safe-area-inset-bottom))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 6px}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:17px;font-weight:650}
h3{margin:0;font-size:15px;font-weight:650}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;padding:0 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{min-height:38px;font-size:14px;padding:0 12px;flex:0 0 auto}
.btn.danger{color:var(--accent);border-color:#E3B9B1}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{min-height:44px;border:none;border-radius:9px;background:transparent;font-weight:650;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips button.ny{border-style:dashed;color:var(--muted)}
.big{font-size:30px;font-weight:750;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.bar.over i{background:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--soft);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.item:first-child{border-top:none}
.item .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .navn{font-weight:600;overflow-wrap:anywhere}
.item .tal{font-weight:700;white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.ide{background:var(--gold-soft);color:var(--gold)}
.pill.koebt{background:var(--green-soft);color:var(--green)}
.pill.givet{background:var(--soft);color:var(--muted)}
.pill.over{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:8px 0}
details.mere summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0;list-style:none}
details.mere summary::-webkit-details-marker{display:none}
details.fold{display:block}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-16px;padding:16px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▸";color:var(--muted);font-size:18px;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>.foldInd{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sektion{border-top:1px solid var(--soft);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sektion:first-of-type{border-top:none;padding-top:0}
.sekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gaverad{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;cursor:pointer;border:none;width:100%;text-align:left}
.gaverad .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.gaverad .t b{font-weight:600;overflow-wrap:anywhere}
.sammen{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.sammen .v{text-align:right;font-weight:650}
.guide{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.4}
.guide b{font-weight:650}
#syncBar{font-size:13px;padding:8px 12px;border-radius:10px;margin-top:6px;cursor:pointer}
#syncBar.ok{background:var(--green-soft);color:var(--green)}
#syncBar.busy{background:var(--soft);color:var(--muted)}
#syncBar.login,#syncBar.error{background:var(--warn-bg);color:var(--warn-ink)}
#syncBar.offline{background:var(--soft);color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--soft);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{border:none;background:none;min-height:52px;border-radius:12px;font-weight:650;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .ik{font-size:20px;line-height:1}
nav.tabs .badge{position:absolute;top:4px;right:calc(50% - 30px);background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px}
.fab{position:fixed;right:max(16px, calc(50% - 294px));bottom:calc(84px + env(safe-area-inset-bottom));min-height:56px;border-radius:28px;padding:0 22px;box-shadow:0 4px 14px rgba(163,49,31,.35);z-index:21}
#arkBg{position:fixed;inset:0;padding-top:calc(8px + var(--top));box-sizing:border-box;background:rgba(25,15,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#ark{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:100%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#ark .arkTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#ark h2{font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + var(--top));min-width:260px;justify-content:space-between;background:#1E1A19;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast button{background:none;border:none;color:#F5B9AE;font-weight:700;font-size:15px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Gaver</h1><div class="muted">Hvem får hvad – og for hvor meget</div></div>
    <div class="row" style="flex:0 0 auto;gap:4px;align-items:center">
      <span class="muted" id="appVersion" style="font-size:12px"></span>
      <button type="button" id="tandhjul" aria-label="Indstillinger" style="width:44px;height:44px;border:none;background:none;font-size:24px;line-height:1;cursor:pointer;padding:0">⚙️</button>
    </div>
  </header>
  <div id="syncBar" class="hidden"></div>

  <!-- ===== Oversigt ===== -->
  <section id="v-oversigt">
    <div class="card hidden" id="hvemKort"></div>
    <div id="invKort"></div>
    <div class="chips" id="anlChips" style="margin-top:10px"></div>
    <div class="card" id="anlKort"></div>
    <div class="card">
      <div class="sekhead"><h2>Personer</h2><span class="muted" id="ovAntal"></span></div>
      <div class="list" id="ovListe"></div>
      <details class="mere" id="ovUden"><summary></summary><div class="list" id="ovUdenListe"></div></details>
    </div>
  </section>

  <!-- ===== Indkøb ===== -->
  <section id="v-indkoeb" class="hidden">
    <div class="chips" id="anlChips2" style="margin-top:10px"></div>
    <div class="card">
      <div class="sekhead"><h2>Skal købes</h2><button type="button" class="btn small" id="delListe">Del liste</button></div>
      <div class="muted">Gaver der stadig er en idé. Tryk <b>Købt</b>, når den er købt.</div>
      <div class="list" id="ideListe"></div>
    </div>
    <div class="card">
      <h2>Mangler en gave</h2>
      <div class="muted">Personer uden gave til denne anledning endnu.</div>
      <div class="list" id="manglerListe"></div>
    </div>
  </section>

  <!-- ===== Personer ===== -->
  <section id="v-personer" class="hidden">
    <div class="card" id="fdagKort"></div>
    <div class="card">
      <input type="search" id="soeg" placeholder="Søg efter person …" autocomplete="off">
      <div class="list" id="personListe"></div>
      <button type="button" class="btn primary" id="nyPerson">+ Tilføj person</button>
    </div>
  </section>
</div>

<button type="button" class="btn primary fab" id="fab">+ Gave</button>

<nav class="tabs">
  <button type="button" data-v="oversigt" aria-pressed="true"><span class="ik">🎁</span>Oversigt</button>
  <button type="button" data-v="indkoeb" aria-pressed="false"><span class="ik">🛍️</span>Indkøb<span class="badge hidden" id="ideBadge"></span></button>
  <button type="button" data-v="personer" aria-pressed="false"><span class="ik">👥</span>Personer</button>
</nav>

<div id="arkBg" class="hidden"><div id="ark" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hidden"></div>

<script>
(function(){
  "use strict";
  const VERSION = "0.7.5";
  const $ = id => document.getElementById(id);
  function el(tag, attrs, ...kids){
    const e=document.createElement(tag);
    if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
      if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
      else if(k==="class") e.className=v; else if(k==="style") e.setAttribute("style",v);
      else if(k==="value") e.value=v; else if(k==="checked") e.checked=!!v; else e.setAttribute(k,v===true?"":v); }
    for(const c of kids.flat()){ if(c==null||c===false) continue; e.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
    return e;
  }
  function newId(p){ return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
  const kr = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("da-DK",{minimumFractionDigits:0,maximumFractionDigits:2})+" kr";
  const tal = v => { const n=parseFloat(String(v==null?"":v).replace(/\./g,"").replace(",",".")); return isFinite(n)&&n>=0 ? n : 0; };
  const heltal = (v,min) => { const n=parseInt(v,10); return isFinite(n)&&n>=min ? n : min; };
  const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  const MDR=["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];

  let toastT=null;
  function toast(msg, fortryd){
    const t=$("toast"); t.replaceChildren(el("span",null,msg));
    if(fortryd) t.appendChild(el("button",{type:"button",onclick:()=>{ t.classList.add("hidden"); fortryd(); }},"Fortryd"));
    t.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"), fortryd?6000:2600);
  }

  // ================= HVEM ER JEG =================
  const HA = location.pathname.startsWith("/gaver-app/");
  let mig = HA ? ls.get("gv_mig",null) : {id:"lokal", navn:"Mig", admin:true};
  const migId = () => mig ? mig.id : "";
  const erAdmin = () => !!(mig && mig.admin);

  // ================= DATA (fælles liste) =================
  // person {kind:"person", navn, fdag:"MM-DD", fAar, note, brugerId, brugerNavn}   brugerId = den HA-bruger der har sagt "Det er mig"
  // anl    {kind:"anl", navn, type:"jul"|"fdag"|"andet", aar, dato}
  // gave   {kind:"gave", personId, anlId, tekst, antal (ønsket), pris (pr. stk), butik, note, oprettetAf, oprettet}
  // koeb   {kind:"koeb", gaveId, personId, anlId, antal, pris (betalt i alt), status:"koebt"|"givet", koebtAf, koebtNavn, oprettet}
  // pbud   {kind:"pbud", bruger, personId, beloeb}          id "pbud-<bruger>-<person>"   (fast budget, kun til mig)
  // budget {kind:"budget", bruger, personId, anlId, beloeb}  id "bud-<bruger>-<person>-<anl>"
  // Serveren sender aldrig køb eller andres idéer til den person, de er til.
  const DATAKEY="gv_data_v2";
  let db = ls.get(DATAKEY,null); if(!db||!db.records) db={records:{},dirty:[]};
  for(const [id,navn,type,aar,dato] of [["anl-jul-2026","Jul 2026","jul",2026,"2026-12-24"],["anl-jul-2027","Jul 2027","jul",2027,"2027-12-24"],["anl-fdag-2026","Fødselsdage 2026","fdag",2026,""],["anl-fdag-2027","Fødselsdage 2027","fdag",2027,""]])
    if(!db.records[id]){ db.records[id]={id,updated:1,kind:"anl",navn,type,aar,dato}; if(!db.dirty.includes(id)) db.dirty.push(id); }
  function persist(){ try{ localStorage.setItem(DATAKEY, JSON.stringify(db)); }catch(e){ toast("Telefonen kunne ikke gemme"); } }
  const levende = kind => Object.values(db.records).filter(r=>r && !r.deleted && r.kind===kind);
  function put(id,data){ const prev=db.records[id]; const now=Math.max(Date.now(), prev?(prev.updated||0)+1:0); db.records[id]=Object.assign({},data,{id,updated:now}); if(!db.dirty.includes(id)) db.dirty.push(id); persist(); renderAll(); scheduleSync(800); return db.records[id]; }
  function del(id){ const prev=db.records[id]; const now=Math.max(Date.now(), prev?(prev.updated||0)+1:0); db.records[id]={id,updated:now,deleted:true,kind:prev?prev.kind:""}; if(!db.dirty.includes(id)) db.dirty.push(id); persist(); renderAll(); scheduleSync(800); }
  function gendan(r){ put(r.id, Object.assign({},r)); }
  const rec = id => { const r=db.records[id]; return r && !r.deleted ? r : null; };

  // skjul på denne enhed (når nogen kigger med) – gemmes kun lokalt
  let skjulte = new Set(ls.get("gv_skjult",[]));
  function saetSkjult(pid,v){ v? skjulte.add(pid) : skjulte.delete(pid); ls.set("gv_skjult",[...skjulte]); renderAll(); }

  const allePersoner = () => levende("person").sort((a,b)=>a.navn.localeCompare(b.navn,"da"));
  const personer = () => allePersoner().filter(p=>!skjulte.has(p.id));
  const erMig = pid => { const p=rec(pid); return !!(p && mig && p.brugerId===mig.id); };
  const minePersoner = () => allePersoner().filter(p=>erMig(p.id));
  const synlig = pid => !skjulte.has(pid);
  const TYPEORD={jul:0,fdag:1,andet:2};
  function idag(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  // En anledning er udløbet dagen efter sin udløbsdato. Så flytter den i arkivet.
  const udloebet = a => !!(a && a.udloeber && a.udloeber < idag());
  const aktive = () => anledninger().filter(a=>!udloebet(a));
  let visTidligere=false;
  const anledninger = () => levende("anl").sort((a,b)=>(a.aar-b.aar)||((TYPEORD[a.type]??9)-(TYPEORD[b.type]??9))||String(a.dato||"").localeCompare(String(b.dato||""))||a.navn.localeCompare(b.navn,"da"));
  const gaver = (pid,aid) => levende("gave").filter(g=>(pid? g.personId===pid : synlig(g.personId))&&(!aid||g.anlId===aid)).sort((a,b)=>(a.oprettet||0)-(b.oprettet||0));
  const koeb = (pid,aid) => levende("koeb").filter(k=>(pid? k.personId===pid : synlig(k.personId))&&(!aid||k.anlId===aid));
  const koebTil = gid => levende("koeb").filter(k=>k.gaveId===gid).sort((a,b)=>(a.oprettet||0)-(b.oprettet||0));
  const mineKoeb = ks => ks.filter(k=>k.koebtAf===migId());
  const sumPris = ks => ks.reduce((s,k)=>s+(Number(k.pris)||0),0);
  const oensket = g => Math.max(1, Number(g.antal)||1);
  const koebtAntal = g => koebTil(g.id).reduce((s,k)=>s+(Number(k.antal)||0),0);
  const mangler = g => Math.max(0, oensket(g)-koebtAntal(g));
  const aaben = g => erMig(g.personId) || mangler(g)>0;     // til mig selv er mit ønske altid "åbent"
  // Budget: mit eget, eller et der er delt med mig (fx forældre om et barns gaver).
  const iGruppe = r => !!r && (r.bruger===migId() || (r.deltMed||[]).includes(migId()));
  const budgetRecs = (kind,pid,aid) => levende(kind).filter(r=>r.personId===pid&&(kind==="pbud"||r.anlId===aid)&&iGruppe(r)).sort((a,b)=>(b.bruger===migId())-(a.bruger===migId()));
  const egetBudgetRec = (pid,aid) => budgetRecs("budget",pid,aid)[0]||null;
  const fastBudgetRec = pid => budgetRecs("pbud",pid)[0]||null;
  const egetBudget = (pid,aid) => { const b=egetBudgetRec(pid,aid); return b? Number(b.beloeb)||0 : 0; };
  const fastBudget = pid => { const b=fastBudgetRec(pid); return b? Number(b.beloeb)||0 : 0; };
  function budgetInfo(pid,aid){ const r=egetBudgetRec(pid,aid)||fastBudgetRec(pid); if(!r) return null; const gruppe=[r.bruger,...(r.deltMed||[])]; return {beloeb:Number(r.beloeb)||0, gruppe, delt:gruppe.length>1, rec:r}; }
  const budget = (pid,aid) => { const b=budgetInfo(pid,aid); return b? b.beloeb : 0; };
  // Brugt mod budgettet: mine køb – eller hele gruppens, når budgettet er delt
  const brugtMod = (pid,aid) => { const b=budgetInfo(pid,aid); const g=b? b.gruppe : [migId()]; return sumPris(koeb(pid,aid).filter(k=>g.includes(k.koebtAf))); };
  const brugerNavn = uid => uid===migId()? "dig" : ((brugere||[]).find(b=>b.id===uid)||{}).navn || "en anden";
  const deltTekst = b => b&&b.delt? "Fælles med "+b.gruppe.filter(u=>u!==migId()).map(brugerNavn).join(", ") : "";
  const venterTekst = r => r&&(r.inviteret||[]).length? "⏳ Venter på at "+ogListe(r.inviteret.map(u=>navnPaa(u)||"en bruger"))+" godkender" : "";
  // Invitationer til at dele et budget med mig
  const invitationer = () => [...levende("pbud"),...levende("budget")].filter(r=>(r.inviteret||[]).includes(migId()));
  function invKort(){
    const inv=invitationer().filter(r=>rec(r.personId));
    $("invKort").replaceChildren(...inv.map(r=>el("div",{class:"card"},
      el("h2",null,"👥 Fælles budget?"),
      el("div",null, el("b",null,r.ejerNavn||navnPaa(r.bruger)||"En bruger")," vil dele budgettet for ",el("b",null,personNavn(r.personId)),
        r.kind==="budget"? " til "+anlNavn(r.anlId) : " (alle anledninger)"," med dig – "+kr(r.beloeb)+(r.kind==="pbud"?" pr. anledning":"")+"."),
      el("div",{class:"muted"},"Godkender du, kan I begge se og rette budgettet, og jeres køb tæller sammen og står som købt af jer begge."),
      el("div",{class:"row"},

      el("div",{class:"row"},felt("Udløber (valgfrit)",udl), el("button",{type:"button",class:"btn small",style:"align-self:flex-end",onclick:()=>{ udl.value=""; }},"Ingen")),
      el("div",{class:"muted"},"Dagen efter udløbsdatoen flytter anledningen i 📦 Arkiv. Den forsvinder fra indkøbslisten, men du kan stadig se den – og flytte ikke-købte idéer og ønsker videre til en ny anledning."),
      el("div",{class:"muted"},"Tip: Brug én \"Fødselsdage\"-anledning pr. år til alle fødselsdage – så kan du se, hvad du har brugt på fødselsdage i alt."),
      el("button",{type:"button",class:"btn primary",onclick:gem},"Gem"),
      a&&erAdmin()? el("button",{type:"button",class:"btn danger",onclick:()=>{
        const rs=[...levende("gave"),...levende("koeb"),...levende("budget")].filter(r=>r.anlId===a.id);
        if(!confirm("Slet "+a.navn+(rs.length?" og alt hvad der hører til":"")+"?")) return;
        const kopi=[a,...rs].map(r=>Object.assign({},r));
        for(const r of rs) del(r.id); del(a.id); valgtAnl=null; lukArk();
        toast(a.navn+" er slettet",()=>{ kopi.forEach(gendan); vaelgAnl(a.id); });
      }},"Slet anledning") : null
    ].filter(Boolean));
  }

  // ================= INDSTILLINGER (⚙️) =================
  // Over http:// og inde i Home Assistants ramme må browseren ikke bruge udklipsholderen eller del-menuen.
  // Så prøves den gamle kopi-metode, og virker den heller ikke, vises teksten så man selv kan kopiere den.
  function gammelKopi(t){
    const ta=el("textarea",{style:"position:fixed;top:0;left:0;width:1px;height:1px;opacity:0",readonly:true}); ta.value=t; document.body.appendChild(ta);
    ta.focus(); ta.select(); try{ ta.setSelectionRange(0,t.length); }catch(e){}
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok;
  }
  async function kopier(t){
    if(window.isSecureContext && navigator.clipboard){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){} }
    return gammelKopi(t);
  }
  function visTekst(titel,t){
    const ta=el("textarea",{readonly:true,style:"min-height:220px;font-size:14px"}); ta.value=t;
    visArk(()=>[ top(titel), el("div",{class:"muted"},"Markér teksten og kopiér den (Ctrl+C / hold fingeren på teksten)."), ta,
      el("button",{type:"button",class:"btn primary",onclick:async()=>{ ta.select(); if(await kopier(t)) toast("Kopieret"); else toast("Markér og kopiér selv"); }},"Kopiér"),
      el("button",{type:"button",class:"btn",onclick:indstArk},"Tilbage") ]);
    setTimeout(()=>{ ta.focus(); ta.select(); },50);
  }
  async function delTekst(titel,tekst,url){
    const alt=url || tekst;
    if(navigator.share && window.isSecureContext){ try{ await navigator.share(Object.assign({title:titel,text:tekst},url?{url}:{})); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
    if(await kopier(alt)){ toast(url?"Linket er kopieret":"Teksten er kopieret"); return; }
    visTekst(titel,alt);
  }
  function oversigtTekst(){
    const a=rec(valgtAnl); if(!a) return "";
    const linjer=[a.navn+" – gaver",""];
    for(const p of personer()){ if(erMig(p.id)) continue; const gs=gaver(p.id,a.id); if(!gs.length) continue;
      linjer.push(p.navn+":"); for(const g of gs){ const ks=koebTil(g.id); linjer.push("  • "+(g.tekst||"?")+(ks.length? " – købt af "+ogListe([...new Set(ks.map(koeberNavn))])+" ("+kr(sumPris(ks))+")" : " – idé"+(g.pris?" ("+kr(g.pris)+")":""))); } }
    return linjer.join("\n");
  }
  // Afsnittene under ⚙️ er foldet sammen, hver gang tandhjulet åbnes. Kun ét afsnit kan være åbent ad gangen – åbner man et, lukker de andre.
  let indstAabne=new Set();
  function fold(noegle,titel,...ind){
    return el("details",{class:"card fold",open:indstAabne.has(noegle),ontoggle:e=>{ const d=e.target; if(d.open){ indstAabne=new Set([noegle]); $("ark").querySelectorAll("details.fold[open]").forEach(x=>{ if(x!==d) x.open=false; }); } else indstAabne.delete(noegle); }},
      el("summary",null,el("h2",null,titel)), el("div",{class:"foldInd"},...ind));
  }
  // Linket til deling skal være Home Assistants adresse udefra (fx Nabu Casa / DuckDNS), ikke homeassistant.local.
  let eksternAdr=null, eksternHentet=false;
  const erLokal=h=>/(\.local|\.lan|\.home|\.internal)$|^localhost$|^(10|127)\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\.|^\[?f[cd]/i.test(h);
  async function hentEksternAdr(){
    if(eksternHentet) return; eksternHentet=true;
    if(!HA) return;
    try{ const r=await api("/api/gaver/link"); if(r.ok){ const j=await r.json(); if(j.url) eksternAdr=String(j.url).replace(/\/+$/,""); } }catch(e){}
    if(!eksternAdr){ try{ const r=await api("/api/config"); if(r.ok){ const c=await r.json(); if(c.external_url) eksternAdr=String(c.external_url).replace(/\/+$/,""); } }catch(e){ eksternHentet=false; return; } }
    if(aabentArk) aabentArk();
  }
  const startLink=()=>{ const o=!erLokal(location.hostname)? location.origin : (eksternAdr||location.origin); return o+"/gaver-start"; };
  const linkErLokal=()=>{ try{ return erLokal(new URL(startLink()).hostname); }catch(e){ return false; } };
  function indstArk(){
    indstAabne=new Set();
    hentEksternAdr();
    const trin=[
      ["Tilføj personer","under 👥 Personer – også dem du deler listen med. Skriv gerne fødselsdag og dit eget budget (kun du kan se det, medmindre du deler det)."],
      ["Del listen","under 🔗 Del. De andre logger ind med deres egen Home Assistant-bruger og vælger deres navn under ✋ Hvem er du?. Så kan de ikke se, hvad der er købt til dem."],
      ["Ønsker","Når du har valgt dit navn, kan du skrive dine egne ønsker på dig selv. De bliver stående hos dig, også når nogen har købt dem."],
      ["Tilføj en gave","med + Gave. Skriv antal, hvis der ønskes flere stk. Vælg \"Jeg har købt den\" hvis den allerede er købt."],
      ["Køb ind","under 🛍️ Indkøb står alle idéer og ønsker, der mangler at blive købt. Tryk Købt ✓. Ønskes der 3 stk og er der købt 1, bliver den stående med \"2 mangler\"."],
      ["Budget","Oversigten viser hvad du har brugt, og hvad alle har brugt. En person bliver rød, hvis du er over dit budget."],
      ["Del budget","fx med den anden forælder: tryk på personen → Ret person (eller på budgettet for én anledning) og vælg under \"Del budgettet med\". Den anden får et kort øverst på oversigten og skal trykke Godkend – indtil da står der ⏳ Venter. Bagefter kan I begge se og rette beløbet, jeres køb tæller sammen mod budgettet, og gaverne står som \"Købt af\" jer begge. Tryk Afvis for at sige nej tak."],
      ["Kigger nogen med?","tryk på personen → 🙈 Skjul. Det gælder kun på denne telefon."]
    ];
    const tegn=()=>{ const link=startLink(); const alle=allePersoner(); const mine=minePersoner(); return [
      top("Indstillinger","Gaver v"+VERSION+(mig? " · "+mig.navn+(erAdmin()?" (administrator)":"") : "")),
      fold("hvem","✋ Hvem er du?",
        mine.length? el("div",null,"Du er ",el("b",null,mine.map(p=>p.navn).join(", ")),". Du kan ikke se, hvad der er købt til dig.") : el("div",{class:"muted"},"Du har ikke valgt dit navn. Du kan kun vælge én gang."),
        mine.length? null : el("button",{type:"button",class:"btn",onclick:hvemArk},"Vælg mit navn")),
      erAdmin()? adminKort() : null,
      fold("del","🔗 Del",
        el("div",{style:"font-size:14px;word-break:break-all;user-select:all;-webkit-user-select:all"},link),
        linkErLokal()? el("div",{class:"muted"},"⚠️ Det her link virker kun hjemme på jeres eget net. Sæt en ekstern adresse i Home Assistant (Indstillinger → System → Netværk), så virker det også ude.") : null,
        el("div",{class:"row",style:"display:flex;gap:8px"},
          el("button",{type:"button",class:"btn",style:"flex:1",onclick:async()=>{ if(await kopier(link)) toast("Linket er kopieret"); else visTekst("Link til Gaver",link); }},"Kopiér link"),
          el("button",{type:"button",class:"btn primary",style:"flex:1",onclick:()=>delTekst("Gaver","Vores fælles gaveliste – log ind, tryk ✋ og vælg dit navn",link)},"Del gavelisten")),
        el("div",{class:"muted"},"Alle deler den samme liste. Den der får linket skal have en bruger i Home Assistant (Indstillinger → Personer). Når de har valgt deres navn, kan de ikke se købene til sig selv – heller ikke hvis de leder i data."),
        rec(valgtAnl)? el("button",{type:"button",class:"btn",onclick:()=>delTekst(anlNavn(valgtAnl),oversigtTekst())},"Del oversigt over "+anlNavn(valgtAnl)+" som tekst") : null,
        rec(valgtAnl)? el("button",{type:"button",class:"btn",onclick:()=>delTekst(anlNavn(valgtAnl),listeTekst())},"Del indkøbsliste som tekst") : null,
        el("div",{class:"muted"},"⚠️ En oversigt sendt som tekst viser alt – send den ikke til nogen, der er på den.")),
      alle.length? fold("skjul","🙈 Skjul personer på denne telefon",
        el("div",{class:"muted"},"Kigger en person med over skulderen? Skjul dem, så deres gaver og priser forsvinder fra skærmen – også fra totalerne. Tryk igen for at vise dem."),
        el("div",{class:"chips",style:"flex-wrap:wrap"},...alle.filter(p=>!erMig(p.id)).map(p=>el("button",{type:"button","aria-pressed":String(skjulte.has(p.id)),onclick:()=>saetSkjult(p.id,!skjulte.has(p.id))},(skjulte.has(p.id)?"🙈 ":"")+p.navn))),
        skjulte.size? el("button",{type:"button",class:"btn",onclick:()=>{ skjulte=new Set(); ls.set("gv_skjult",[]); renderAll(); toast("Alle vises igen"); }},"Vis alle igen") : null) : null,
      fold("guide","📖 Sådan bruger du Gaver", el("ol",{class:"guide"},...trin.map(([t,x])=>el("li",null,el("b",null,t)," ",x)))),
      fold("iphone","📱 På iPhone",
        el("div",{class:"muted"},"Åbn "+link+" i Safari → Del → Føj til hjemmeskærm. Appen virker også uden dækning og sender ændringerne, når der er forbindelse igen."))
    ].filter(Boolean); };
    visArk(tegn,true);
  }
  $("tandhjul").addEventListener("click",indstArk);

  // ---- administratorer: åbn "det er mig" igen og vælg administratorer ----
  let brugere=null, brugereFejl="";
  async function hentBrugere(stille){
    if(!HA){ brugere=[{id:"lokal",navn:"Mig",haAdmin:true,admin:true,person:""}]; return; }
    try{ const r=await api("/api/gaver/brugere"); if(!r.ok) throw new Error(r.status); brugere=(await r.json()).brugere||[]; brugereFejl=""; }
    catch(e){ brugereFejl="Kunne ikke hente brugerne – prøv igen, når der er forbindelse."; }
    if(!stille && aabentArk) aabentArk();
  }
  async function saetBruger(b,felter,besked){
    try{ const r=await api("/api/gaver/brugere",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({id:b.id},felter))}); if(!r.ok) throw new Error(r.status);
      toast(besked); }catch(e){ toast("Det lykkedes ikke – prøv igen"); }
    hentBrugere();
  }
  const saetAdmin=(b,v)=>saetBruger(b,{admin:v},b.navn+(v?" er nu administrator":" er ikke længere administrator"));
  function adminKort(){
    if(brugere===null && !brugereFejl){ hentBrugere(); }
    const claimed=allePersoner().filter(p=>p.brugerId);
    return fold("admin","🔑 Administrator",
      el("div",{class:"muted"},"Kun administratorer kan åbne for \"det er mig\" igen, slette personer og anledninger, vælge andre administratorer og bestemme, hvem man kan dele budget med."),
      el("h3",null,"Hvem er hvem"),
      claimed.length? el("div",{class:"list"},...claimed.map(p=>el("div",{class:"item",style:"cursor:default"},
        el("div",{class:"txt"},el("span",{class:"navn"},p.navn),el("span",{class:"muted"},"✋ "+(p.brugerNavn||"en bruger"))),
        el("button",{type:"button",class:"btn small",onclick:()=>{ if(!confirm("Åbn for "+p.navn+" igen? Så kan "+(p.brugerNavn||"brugeren")+" vælge et andet navn – og kan se, hvad der er købt til "+p.navn+", indtil der er valgt igen.")) return; put(p.id,Object.assign({},p,{brugerId:""})); toast(p.navn+" er åbnet igen"); }},"Åbn igen"))))
        : el("div",{class:"empty"},"Ingen har valgt deres navn endnu."),
      el("h3",null,"Administratorer"),
      brugereFejl? el("div",{class:"muted"},brugereFejl) : brugere===null? el("div",{class:"muted"},"Henter brugere …") :
      el("div",{class:"list"},...brugere.map(b=>el("div",{class:"item",style:"cursor:default"},
        el("div",{class:"txt"},el("span",{class:"navn"},b.navn+(mig&&b.id===mig.id?" (dig)":"")), el("span",{class:"muted"}, b.haAdmin? "Administrator i Home Assistant" : (b.person? "✋ "+b.person : "Har ikke valgt navn"))),
        b.haAdmin||(mig&&b.id===mig.id)? el("span",{class:"pill koebt"},"Admin") :
          el("button",{type:"button",class:"btn small"+(b.admin?" ok":""),onclick:()=>saetAdmin(b,!b.admin)},b.admin?"Admin ✓":"Gør til admin")))),
      el("h3",null,"Kan vælges ved deling af budget"),
      el("div",{class:"muted"},"Slå brugere fra, som ikke skal kunne vælges, når nogen deler et budget – fx børn eller ekstra brugere i Home Assistant."),
      brugere&&!brugereFejl? el("div",{class:"chips",style:"flex-wrap:wrap"},...brugere.map(b=>el("button",{type:"button","aria-pressed":String(!b.skjulIDeling),
        onclick:()=>saetBruger(b,{skjulIDeling:!b.skjulIDeling}, b.navn+(b.skjulIDeling?" kan nu vælges ved deling":" vises ikke længere ved deling"))},(b.skjulIDeling?"🚫 ":"✓ ")+b.navn))) : null
    );
  }
  // ================= LOGIN (samme Home Assistant-login som de andre apps) =================
  let inFrame=false; try{ inFrame = window.self !== window.top; }catch(e){ inFrame=true; }
  const APP_BASE = location.origin + "/gaver-app/";
  const CLIENT_ID = APP_BASE, REDIRECT_URI = APP_BASE + "index.html";
  const authGet=()=>ls.get("gv_auth",null);
  const authSet=a=>{ try{ a?localStorage.setItem("gv_auth",JSON.stringify(a)):localStorage.removeItem("gv_auth"); }catch(e){} };
  function fetchT(url, opts, ms){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms||20000); return fetch(url, Object.assign({}, opts||{}, {signal:ac.signal})).finally(()=>clearTimeout(t)); }
  async function tokenRequest(params){
    const r=await fetchT("/auth/token",{method:"POST",body:new URLSearchParams(params)});
    if(!r.ok){ const e=new Error("auth "+r.status); e.status=r.status; throw e; }
    const j=await r.json();
    return {access_token:j.access_token, refresh_token:j.refresh_token||params.refresh_token, expires:Date.now()+(j.expires_in||1800)*1000, clientId:params.client_id};
  }
  async function parentToken(){
    try{ if(!inFrame) return null; const ha=window.parent.document.querySelector("home-assistant"); const a=ha&&ha.hass&&ha.hass.auth; if(!a) return null; if(a.expired) await Promise.race([a.refreshAccessToken(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000))]); return a.accessToken||null; }catch(e){ return null; }
  }
  async function getToken(force){
    const pt=await parentToken(); if(pt) return pt;
    let a=authGet();
    if(!a){ const h=ls.get("hassTokens",null); if(h&&h.refresh_token&&h.clientId) a={access_token:h.access_token,refresh_token:h.refresh_token,expires:h.expires||0,clientId:h.clientId,borrowed:true}; }
    if(!a) return null;
    if(!force && a.access_token && a.expires>Date.now()+30000) return a.access_token;
    try{ const n=await tokenRequest({grant_type:"refresh_token",refresh_token:a.refresh_token,client_id:a.clientId}); if(!a.borrowed) authSet(n); return n.access_token; }
    catch(e){ if(e.status===400||e.status===403){ if(!a.borrowed) authSet(null); return null; } throw e; }
  }
  function startLogin(){
    const st=newId("s"); try{ localStorage.setItem("gv_state",st); }catch(e){}
    location.href="/auth/authorize?response_type=code&client_id="+encodeURIComponent(CLIENT_ID)+"&redirect_uri="+encodeURIComponent(REDIRECT_URI)+"&state="+encodeURIComponent(st);
  }
  async function handleLoginReturn(){
    if(!HA) return;
    const q=new URLSearchParams(location.search); const code=q.get("code"); if(!code) return;
    history.replaceState(null,"",location.pathname+location.hash);
    let expected=null; try{ expected=localStorage.getItem("gv_state"); localStorage.removeItem("gv_state"); }catch(e){}
    if(expected && q.get("state")!==expected){ toast("Login mislykkedes – prøv igen"); return; }
    try{ authSet(await tokenRequest({grant_type:"authorization_code",code,client_id:CLIENT_ID})); toast("Logget ind"); }catch(e){ toast("Login mislykkedes – prøv igen"); }
  }
  async function api(path,opts={},retried){
    const t=await getToken(retried);
    if(!t){ const e=new Error("login"); e.login=true; throw e; }
    const r=await fetchT(path,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:"Bearer "+t})}));
    if(r.status===401 && !retried) return api(path,opts,true);
    if(r.status===401){ authSet(null); const e=new Error("login"); e.login=true; throw e; }
    if(r.status===404){ const e=new Error("mangler"); e.missing=true; throw e; }
    return r;
  }

  // ================= SYNKRONISERING =================
  let syncState={status:HA?"idle":"off", last:ls.get("gv_lastSync",0), msg:""};
  let syncing=false, syncAgain=false, syncTimer=null, syncStart=0, syncTur=0;
  function syncText(){
    const t=syncState.last? new Date(syncState.last).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}) : "";
    const n=db.dirty.length;
    switch(syncState.status){
      case "busy": return ["busy","Synkroniserer …"];
      case "ok": return n? ["busy", n+" ændring(er) venter på at blive sendt"] : ["ok","Synkroniseret med server "+t];
      case "login": return ["login","Ikke logget ind – tryk her for at logge ind på serveren"];
      case "offline": return ["offline","Ingen forbindelse – gemmes på telefonen"+(n?" ("+n+" venter)":"")+" og sendes senere"];
      case "error": return ["error",(syncState.msg||"Kunne ikke synkronisere")+" – tryk for at prøve igen"];
      default: return ["busy","Forbinder …"];
    }
  }
  function setSync(st,msg){ syncState.status=st; syncState.msg=msg||""; drawSync(); }
  function drawSync(){ const b=$("syncBar"); if(!HA){ b.classList.add("hidden"); return; } const [cls,txt]=syncText(); b.className=cls; b.textContent=txt; }
  async function sync(){
    if(!HA) return;
    if(syncing && Date.now()-syncStart<30000){ syncAgain=true; return; }
    if(!navigator.onLine){ setSync("offline"); return; }
    syncing=true; syncStart=Date.now(); const minTur=++syncTur; setSync("busy");
    try{
      const sent={}; const poster=[];
      for(const id of db.dirty){ const r=db.records[id]; if(r){ sent[id]=r.updated; poster.push(r); } }
      await hentMig();
      if(brugere===null && !brugereFejl) hentBrugere(true).then(()=>{ renderOversigt(); renderPersoner(); });
      const res=await api("/api/gaver/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({poster})});
      if(!res.ok) throw new Error("sync "+res.status);
      const j=await res.json(); let changed=false;
      const set=new Set();
      for(const r of (j.poster||[])){ if(!r||!r.id) continue; set.add(r.id); const cur=db.records[r.id]; if(!cur || (r.updated||0)>(cur.updated||0) || ((!db.dirty.includes(r.id) || (r.id in sent && r.updated===sent[r.id] && cur.updated===sent[r.id])) && JSON.stringify(cur)!==JSON.stringify(r))){ db.records[r.id]=r; changed=true; } }
      db.dirty=db.dirty.filter(id=>!(id in sent) || (db.records[id] && db.records[id].updated!==sent[id]));
      // Serveren sender alt, man må se. Det den ikke sender (fx køb til én selv), fjernes fra telefonen.
      if(j.fuld) for(const id of Object.keys(db.records)) if(!set.has(id) && !db.dirty.includes(id)){ delete db.records[id]; changed=true; }
      persist(); if(changed) renderAll();
      syncState.last=Date.now(); ls.set("gv_lastSync",syncState.last);
      if(minTur===syncTur) setSync("ok");
    }catch(e){
      if(minTur!==syncTur) return;
      if(e.name==="AbortError") setSync("error","Serveren svarede ikke i tide");
      else if(e.login) setSync("login");
      else if(e.missing) setSync("error","Serveren svarer ikke");
      else setSync(navigator.onLine?"error":"offline", navigator.onLine?"Kunne ikke synkronisere":"");
    }finally{
      if(minTur===syncTur){ syncing=false; if(syncAgain){ syncAgain=false; scheduleSync(500); } }
    }
  }
  async function hentMig(){
    try{ const r=await api("/api/gaver/mig"); if(r.ok){ const m=await r.json(); const skift=!mig||mig.id!==m.id||mig.admin!==m.admin||mig.navn!==m.navn; mig=m; ls.set("gv_mig",m); if(skift){ brugere=null; renderAll(); } } }catch(e){ if(e.login) throw e; }
  }
  function scheduleSync(ms){ if(!HA) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms); drawSync(); }
  $("syncBar").addEventListener("click",()=>{ syncState.status==="login" ? startLogin() : sync(); });

  // ================= START =================
  $("appVersion").textContent="v"+VERSION;
  persist(); renderAll();
  if("serviceWorker" in navigator && HA) navigator.serviceWorker.register("sw.js").catch(()=>{});
  (async()=>{
    await handleLoginReturn();
    sync();
    window.addEventListener("online",()=>sync());
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sync(); });
    setInterval(()=>{ if(!document.hidden) sync(); },60000);
  })();
})();
</script>
